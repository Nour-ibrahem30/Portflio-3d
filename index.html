<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Nour Ibrahem Mohamed - Front-End Developer Portfolio</title>
    <meta name="title" content="Nour Ibrahem Mohamed - Front-End Developer Portfolio" />
    <meta name="description" content="Front-End Developer passionate about building clean, responsive, and user-friendly web interfaces. Skilled in HTML5, CSS3, JavaScript (ES6+), SCSS, and React." />
    <meta name="keywords" content="Front-End Developer, React, JavaScript, HTML5, CSS3, SCSS, TypeScript, Web Development, Portfolio, Nour Ibrahem, Cairo Egypt" />
    <meta name="author" content="Nour Ibrahem Mohamed" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nour-ibrahem.com/" />
    <meta property="og:title" content="Nour Ibrahem Mohamed - Front-End Developer Portfolio" />
    <meta property="og:description" content="Front-End Developer passionate about building clean, responsive, and user-friendly web interfaces. Skilled in HTML5, CSS3, JavaScript (ES6+), SCSS, and React." />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nour-ibrahem.com/" />
    <meta property="twitter:title" content="Nour Ibrahem Mohamed - Front-End Developer Portfolio" />
    <meta property="twitter:description" content="Front-End Developer passionate about building clean, responsive, and user-friendly web interfaces. Skilled in HTML5, CSS3, JavaScript (ES6+), SCSS, and React." />
    <meta property="twitter:image" content="/og-image.jpg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Fonts - Non-render-blocking with preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the font CSS as high priority but non-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"></noscript>
    
    <!-- Preconnect GitHub API to save 460ms on LCP -->
    <link rel="preconnect" href="https://api.github.com" crossorigin>
    <!-- Preload critical resources -->
    <link rel="dns-prefetch" href="https://api.github.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Inline critical font subset and CSS for faster FCP -->
    <style>
      @font-face {
        font-family: 'Inter-fallback';
        font-style: normal;
        font-weight: 400;
        src: local('Arial');
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
      }
      body {
        font-family: 'Inter', 'Inter-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Critical CSS for initial render */
      #root { min-height: 100vh; background: #000; }
      .bg-black { background-color: #000; }
      .text-white { color: #fff; }
      .min-h-screen { min-height: 100vh; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      /* Reduce layout shifts */
      * { box-sizing: border-box; }
      img, video { max-width: 100%; height: auto; }
      /* Prevent FOUC */
      body { visibility: visible; }
    </style>
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
